# Base de datos de prueba (diferente a la de desarrollo)
spring.datasource.url=jdbc:mysql://localhost:3306/cstore_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=diego234

# Hibernate crea las tablas al iniciar y las borra al terminar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Email — deshabilitado en tests para no enviar correos reales
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false