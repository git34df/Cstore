<div class="forgot-container">
  <h2>Recuperar contraseña</h2>

  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Ingresa tu correo"
        required
      />
      <div
        class="error"
        *ngIf="
          forgotForm.get('email')?.touched &&
          forgotForm.get('email')?.invalid
        "
      >
        <small *ngIf="forgotForm.get('email')?.errors?.['required']">
          El correo es obligatorio.
        </small>
        <small *ngIf="forgotForm.get('email')?.errors?.['email']">
          Ingresa un correo válido.
        </small>
      </div>
    </div>

    <button type="submit" [disabled]="forgotForm.invalid || loading">
      {{ loading ? 'Enviando...' : 'Enviar enlace' }}
    </button>
  </form>

  <div class="message success" *ngIf="message">{{ message }}</div>
  <div class="message error" *ngIf="error">{{ error }}</div>
</div>
