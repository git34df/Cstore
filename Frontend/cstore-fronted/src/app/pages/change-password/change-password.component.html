<div class="password-container">
  <h2>Cambiar Contraseña</h2>

  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Contraseña actual</label>
      <input type="password" formControlName="oldPassword" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label>Nueva contraseña</label>
      <input type="password" formControlName="newPassword" placeholder="••••••••" />
    </div>

    <button type="submit" [disabled]="loading || passwordForm.invalid">
      {{ loading ? 'Actualizando...' : 'Cambiar Contraseña' }}
    </button>

    <p *ngIf="message" class="success">{{ message }}</p>
    <p *ngIf="error" class="error">{{ error }}</p>
  </form>
</div>
